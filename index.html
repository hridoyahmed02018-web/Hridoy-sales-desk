<title>Executive Sales Desk</title>
<style>
:root{--navy:#0d2238;--blue:#175d91;--gold:#c69a45;--bg:#f3f6fa;--ink:#1c2d40;--muted:#68798c;--line:#dce4ec;--green:#167653}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.6}
header{background:linear-gradient(120deg,#0b1d30,#174c76);color:#fff;padding:24px 16px 22px;border-bottom:3px solid var(--gold)}
.wrap{max-width:1180px;margin:auto}header h1{font-size:23px;margin:0}header p{margin:4px 0 0;color:#d9e6f1;font-size:12px}
main{max-width:1180px;margin:18px auto;padding:0 12px 35px}
.principle{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:11px 13px;margin-bottom:13px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 17px;border-radius:9px;font-weight:700;cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}input[type=search]{flex:1;min-width:190px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.btn{border:0;border-radius:8px;padding:9px 12px;background:var(--blue);color:white;font-weight:700;cursor:pointer;font-size:13px}.btn.copy{background:var(--green)}.btn.alt{background:#e8eef5;color:var(--navy)}.btn.dark{background:var(--navy)}
.layout{display:grid;grid-template-columns:255px 1fr;gap:13px}nav,.content{background:#fff;border:1px solid var(--line);border-radius:12px}
nav{padding:8px;height:max-content;position:sticky;top:8px;max-height:80vh;overflow:auto}
.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:7px;color:var(--ink);font-size:13px;cursor:pointer}.navbtn.active,.navbtn:hover{background:#eaf2f9;color:#104f7e;font-weight:700}
.content{padding:15px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}h2{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted)}
.step{background:#f4f8fc;border:1px solid #e2ebf3;padding:9px 11px;border-radius:8px;font-size:12px;margin:8px 0 12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.card h3{font-size:14px;margin:0}.tag{font-size:10px;color:#175d91;background:#eaf2fb;padding:3px 7px;border-radius:20px;white-space:nowrap}
.say{font-size:13px;background:#f8fafc;border:1px solid #edf1f5;padding:11px;border-radius:8px;white-space:pre-wrap;color:#2b4054}
.tip{font-size:11px;color:#697b8e;margin-top:7px}.actions{display:flex;justify-content:flex-end;margin-top:8px}
.empty{text-align:center;padding:25px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#142d43;color:#fff;padding:9px 14px;border-radius:22px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:720px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr}.navbtn{font-size:11px;padding:8px}.content{padding:11px}header h1{font-size:20px}}
</style></head>

<header><div class="wrap"><h1>EXECUTIVE SALES DESK</h1><p>Customer Consultation & E-commerce Website Solutions</p></div></header>
<main>
<div class="principle"><b>আমাদের যোগাযোগের নীতি:</b> আমরা শুধু ওয়েবসাইট বিক্রি করতে কথা বলি না। প্রথমে ব্যবসার বর্তমান পদ্ধতি ও কাস্টমারের অসুবিধা বুঝি, তারপর প্রয়োজন থাকলে উপযুক্ত সমাধান দেখাই।</div>
<div class="tabs"><button class="tab active" id="callTab" onclick="setMode('call')">☎ কল গাইড</button><button class="tab" id="msgTab" onclick="setMode('msg')">✉ মেসেজ লাইব্রেরি</button></div>
<div class="toolbar"><input id="search" type="search" placeholder="এই সেকশনে খুঁজুন..."><button class="btn alt" onclick="resetSearch()">সব দেখুন</button></div>
<div class="layout"><nav id="nav"></nav><section class="content">
<div class="head"><div><h2 id="title"></h2><div class="sub" id="subtitle"></div></div><button class="btn dark" onclick="copyAll()">বিভাগের সব কপি</button></div>
<div id="intro" class="step"></div><div id="cards"></div>
</section></div>
<footer>EXECUTIVE SALES DESK · Internal Use</footer></main><div class="toast" id="toast">কপি হয়েছে</div>
<script>
const callSections=[
{title:"১. কলের আগে প্রস্তুতি",intro:"কল দেওয়ার আগে ব্যবসার পেজ, পণ্যের ধরন ও যোগাযোগের তথ্য দেখে নিন। নাম/প্রতিষ্ঠান সম্পর্কে নিশ্চিত না হলে অনুমান করে বলবেন না।",items:[
["নিজের প্রস্তুতি","• পেজ ও ব্যবসার নাম ঠিকভাবে দেখে নিন\n• কী ধরনের পণ্য বিক্রি করে বুঝে নিন\n• কলের উদ্দেশ্য এক বাক্যে ঠিক করুন\n• কথা বলার সময় ১–২ মিনিটের অনুমতি নিন","লক্ষ্য: প্রস্তুত ও পেশাদারভাবে কথা বলা।"],
["কলের উদ্দেশ্য মনে রাখুন","প্রথম কলেই বিক্রি বা পেমেন্ট চাইবেন না। আগে বুঝুন—কাস্টমার কীভাবে পণ্য দেখান, অর্ডার নেন এবং অর্ডার পরিচালনা করেন।","লক্ষ্য: প্রয়োজন বোঝা, চাপ তৈরি নয়।"]

{title:"২. কল শুরু — প্রথম ২০ সেকেন্ড",intro:"প্রথমেই পরিচয়, যোগাযোগের কারণ এবং সময়ের অনুমতি। সংক্ষিপ্ত ও স্বাভাবিকভাবে বলুন।",items:[

["কাস্টমার ব্যস্ত থাকলে","অবশ্যই, বুঝতে পারছি। আপনার সুবিধাজনক সময়টি জানালে সে অনুযায়ী সংক্ষেপে যোগাযোগ করব।","সময় নিশ্চিত করুন; অনুমতি ছাড়া বারবার কল নয়।"],

["কেন কল করেছেন?","আপনার ব্যবসার পণ্যগুলো কাস্টমারদের কাছে আরও গোছানোভাবে উপস্থাপন এবং অর্ডার প্রক্রিয়া সহজ করার বিষয়ে একটি প্রস্তাব জানাতে যোগাযোগ করেছি। আগে আপনার বর্তমান পদ্ধতিটা বুঝতে চাই।","সরাসরি প্যাকেজে চলে যাবেন না।"]
]},
{title:"৩. প্রয়োজন বোঝা — প্রশ্ন করুন",intro:"এ পর্যায়ে বেশি কথা বলবেন না। কাস্টমারকে বলতে দিন। একবারে একটি প্রশ্ন করুন এবং উত্তর মনোযোগ দিয়ে শুনুন।",items:[
["প্রথম প্রশ্ন — অর্ডার কীভাবে নেন?","আপনারা বর্তমানে কাস্টমারদের অর্ডার মূলত ফেসবুক ইনবক্স/মেসেঞ্জারের মাধ্যমে নেন, নাকি অন্য কোনো ব্যবস্থাও রয়েছে?","উত্তর অনুযায়ী পরের প্রশ্ন বেছে নিন।"],
["দ্বিতীয় প্রশ্ন — পণ্য দেখানোর পদ্ধতি","কাস্টমাররা কি এক জায়গায় আপনার সব পণ্য, মূল্য ও বিস্তারিত তথ্য দেখতে পারেন, নাকি পোস্ট/ইনবক্স থেকে খুঁজে নিতে হয়?","সম্ভাব্য অসুবিধা চিহ্নিত করুন।"],

]},
{title:"৪. সমস্যার সঙ্গে সমাধান যুক্ত করুন",intro:"কাস্টমারের বলা সমস্যাটিই সংক্ষেপে ফিরিয়ে বলুন। তারপর ওয়েবসাইটের প্রাসঙ্গিক সুবিধা ব্যাখ্যা করুন।",items:[

["পণ্য খুঁজে পেতে সমস্যা হলে","এ ক্ষেত্রে ওয়েবসাইটে পণ্যগুলো ক্যাটাগরি ও বিস্তারিতসহ সাজিয়ে রাখা যায়। কাস্টমার এক জায়গায় পণ্য দেখতে পারবেন, ফলে বারবার পোস্ট বা ইনবক্সে তথ্য খোঁজার প্রয়োজন কমতে পারে।","অতিরিক্ত ফলাফলের নিশ্চয়তা দেবেন না।"],

{title:"৫. সার্ভিস সংক্ষেপে উপস্থাপন",intro:"প্রয়োজন বোঝার পরেই ফিচার বলুন। সব ফিচার একসঙ্গে পড়ে শোনাবেন না—যেটি কাস্টমারের জন্য প্রাসঙ্গিক সেটি আগে বলুন।",items:[
["৩০ সেকেন্ডের সার্ভিস পরিচিতি","আমাদের ই-কমার্স ওয়েবসাইটে কাস্টমাররা পণ্য দেখতে ও অর্ডার করতে পারবেন। আপনি সহজ ড্যাশবোর্ড থেকে পণ্য ও অর্ডার পরিচালনা করতে পারবেন। পাশাপাশি রয়েছে নিজস্ব অ্যাপ ব্যবহারের সুবিধা, মাল্টি-সার্ভার হোস্টিং এবং দ্রুত লোডিংয়ের জন্য অপটিমাইজড ব্যবস্থা।","ফিচারের সুনির্দিষ্ট শর্ত ডেমো/প্যাকেজে যাচাই করে বলুন।"],
["অর্ডার ম্যানেজমেন্ট বোঝাতে","ওয়েবসাইটের মাধ্যমে কাস্টমার অর্ডার দিতে পারবেন এবং আপনি নির্ধারিত অ্যাডমিন প্যানেল থেকে অর্ডার ও পণ্যের তথ্য পরিচালনা করতে পারবেন। এতে কাজগুলো আরও গোছানোভাবে রাখা সম্ভব।","যে ফিচার বাস্তবে আছে সেটিই দেখান।"],
["অ্যাপ সুবিধা বোঝাতে","আমাদের প্ল্যাটফর্মে নিজস্ব অ্যাপ ব্যবহারের সুবিধা রয়েছে। অ্যাপটি কীভাবে ইনস্টল বা ব্যবহার করা যাবে, সেটি ডেমোতে দেখিয়ে দিতে পারি।","Play Store-এ আছে—এমন দাবি করবেন না, যদি নিশ্চিত না হন।"],
["হোস্টিং ও পারফরম্যান্স","প্ল্যাটফর্মে মাল্টি-সার্ভার হোস্টিং এবং দ্রুত লোডিংয়ের জন্য অপটিমাইজড ব্যবস্থা রয়েছে। চাইলে ডেমো খুলে আপনার ডিভাইস থেকেই দেখে নিতে পারেন।","‘শূন্য লোডিং টাইম’ বলবেন না; কোনো সাইটের লোডিং সময় শূন্য নয়।"]
]},
{title:"৬. ট্রায়াল দেখানোর প্রস্তাব",intro:"কাস্টমার আগ্রহ দেখালে পরবর্তী পদক্ষেপ হিসেবে ডেমো দেখান। এতে সিদ্ধান্ত নেওয়ার আগে তিনি নিজেই যাচাই করতে পারবেন।",items:[
["স্বাভাবিকভাবে ডেমো অফার","আপনার ব্যবসার ধরন অনুযায়ী একটি ট্রায়াল/ডেমো ওয়েবসাইট দেখাতে পারি। এতে পণ্য কীভাবে সাজানো হয়, কাস্টমার কীভাবে অর্ডার করেন এবং আপনি কীভাবে পরিচালনা করবেন—এসব সরাসরি বুঝতে পারবেন। দেখে তারপর সিদ্ধান্ত নিতে পারবেন।","ডেমো তৈরির সময় ও শর্ত আগে নিশ্চিত করুন।"],
["ডেমো দেখতে রাজি হলে","ধন্যবাদ। আপনার ব্যবসার নাম, পেজের লিংক এবং পণ্যের ধরনটি জানালে আপনার ব্যবসার সঙ্গে মিল রেখে উপযুক্ত ডেমো দেখানোর ব্যবস্থা করতে পারব।","প্রয়োজনীয় তথ্যই শুধু সংগ্রহ করুন।"],
["ডেমো দেখে মতামত জানতে","ডেমোটি দেখে আপনার কাছে কোন বিষয়টি সবচেয়ে কার্যকর মনে হয়েছে? আপনার ব্যবসার প্রয়োজন অনুযায়ী কোনো পরিবর্তন দরকার হলে জানাতে পারেন।","কাস্টমারের মতামত শুনুন; তাড়াহুড়ো করে অর্ডার চাইবেন না।"]
]},
{title:"৭. মূল্য ও সিদ্ধান্তের আলোচনা",intro:"কাস্টমার সার্ভিস বুঝেছেন বা মূল্য জানতে চেয়েছেন—তখন পরিষ্কারভাবে মূল্য বলুন। লুকানো খরচ বা অস্পষ্ট প্রতিশ্রুতি নয়।",items:[
["মূল্য জানতে চাইলে","প্রথমবার সেটআপ চার্জ ১,০০০ টাকা, যা একবারই দিতে হবে। এরপর বছরে ২,৫০০ টাকা প্ল্যাটফর্ম চার্জ দিয়ে ওয়েবসাইট লাইভ রাখতে পারবেন। অর্থাৎ প্রথম বছরে মোট ৩,৫০০ টাকা। অতিরিক্ত কাস্টম কাজ থাকলে তার খরচ আগে জানানো হবে।","প্যাকেজের শর্তও একই সঙ্গে স্পষ্ট করুন।"],
["দাম বেশি মনে হলে","আপনার বাজেটের বিষয়টি বুঝতে পারছি। সিদ্ধান্তের আগে ডেমো দেখে প্যাকেজে কী কী সুবিধা রয়েছে তা যাচাই করতে পারেন। আপনার ব্যবসায় সুবিধাগুলো বাস্তব কাজে লাগবে মনে হলেই এগোনো উচিত।","মূল্য কমানোর মিথ্যা প্রতিশ্রুতি নয়।"],
["এখন বাজেট নেই বললে","বুঝতে পারছি। এই মুহূর্তে বাজেট উপযুক্ত না হলে এখনই সিদ্ধান্ত নেওয়ার প্রয়োজন নেই। চাইলে ডেমো ও প্যাকেজের তথ্য রেখে দিতে পারেন; ভবিষ্যতে সুবিধাজনক সময়ে বিবেচনা করবেন।","সম্পর্ক ভালো রাখুন।"],
["ব্যবসা ছোট বললে","বুঝতে পারছি। ছোট ব্যবসার ক্ষেত্রেও পণ্যগুলো গোছানোভাবে দেখানো ও অর্ডার নেওয়া সহজ হতে পারে। তবে আপনার বর্তমান বিক্রির পরিমাণ ও প্রয়োজনের সঙ্গে খরচটি মানানসই কি না, সেটি বিবেচনা করেই সিদ্ধান্ত নেওয়া ভালো।","ছোট ব্যবসাকে ছোট করে বলবেন না, আবার অপ্রয়োজনীয় চাপও দেবেন না।"]
]},
{title:"৮. ভিন্ন পরিস্থিতি সামলানো",intro:"কাস্টমারের আপত্তি শুনে আগে স্বীকার করুন, তারপর প্রাসঙ্গিক উত্তর দিন। তর্ক করবেন না।",items:[
["আগে থেকেই ওয়েবসাইট আছে","চমৎকার। আপনার বর্তমান ওয়েবসাইটে কি অর্ডার ম্যানেজমেন্ট, অ্যাপ সুবিধা ও হোস্টিং নিয়ে আপনি সন্তুষ্ট? চাইলে আমাদের ডেমোটি বিকল্প হিসেবে দেখাতে পারি। আপনার বর্তমান ব্যবস্থার সঙ্গে তুলনা করে দেখবেন—উপযোগী মনে হলেই বিবেচনা করবেন।","বর্তমান সেবা খারাপ—এমন মন্তব্য করবেন না।"],
["ফেসবুকেই ভালো অর্ডার আসে","এটা ভালো বিষয়। ওয়েবসাইট ফেসবুকের বিকল্প নয়; এটি অতিরিক্ত একটি নিজস্ব প্ল্যাটফর্ম, যেখানে পণ্য ও অর্ডার আরও গোছানোভাবে রাখা যায়। আপনার বর্তমান ব্যবস্থার পাশাপাশি এটি দরকার কি না, সেটি দেখে নিতে পারেন।","কাস্টমারের সফলতাকে স্বীকৃতি দিন।"],
["এখন প্রয়োজন নেই","ঠিক আছে। আপনার বর্তমান ব্যবসায় যদি ওয়েবসাইটের প্রয়োজন না থাকে, তাহলে এখনই নেওয়ার দরকার নেই। ভবিষ্যতে পণ্য উপস্থাপন বা অর্ডার পরিচালনা সহজ করার প্রয়োজন হলে আমরা সহযোগিতা করতে পারব।","ভদ্রভাবে কথোপকথন শেষ করুন।"],
["অন্য কোম্পানি কম দাম বলেছে","অবশ্যই, তুলনা করে দেখা ভালো। শুধু সেটআপ মূল্য নয়—বার্ষিক খরচ, হোস্টিং, ফিচার, সাপোর্ট ও ডেটা ব্যবস্থাপনার শর্তও মিলিয়ে দেখবেন। চাইলে আমাদের প্যাকেজের অন্তর্ভুক্ত বিষয়গুলো জানাতে পারি।","প্রতিদ্বন্দ্বী প্রতিষ্ঠানকে ছোট করবেন না।"],
["সিদ্ধান্ত নিতে সময় চাইলে","অবশ্যই, সময় নিয়ে সিদ্ধান্ত নিন। আপনার কি কোনো নির্দিষ্ট বিষয় পরিষ্কার করা দরকার, নাকি ডেমোটি দেখে পরে জানাতে চান? আপনার সুবিধা অনুযায়ী এগোব।","একটি নির্দিষ্ট পরবর্তী পদক্ষেপ ঠিক করুন।"]
]},
{title:"৯. কল শেষ ও পরবর্তী পদক্ষেপ",intro:"প্রতিটি কলের শেষে পরবর্তী পদক্ষেপ পরিষ্কার করুন—ডেমো পাঠাবেন, তথ্য পাঠাবেন, নাকি নির্দিষ্ট সময়ে আবার যোগাযোগ করবেন।",items:[
["আগ্রহী কিন্তু এখনই সিদ্ধান্ত নয়","আপনার সময় দেওয়ার জন্য ধন্যবাদ। আমি সার্ভিসের সংক্ষিপ্ত তথ্য/ডেমো পাঠিয়ে দিচ্ছি। দেখে আপনার সুবিধামতো মতামত জানাবেন।","পরবর্তী যোগাযোগের অনুমতি নিন।"],
["ডেমো পাঠানোর পর কল শেষ","ডেমোটি পাঠিয়ে দিচ্ছি। সময় করে দেখে নেবেন। আপনার কোনো প্রশ্ন বা পরামর্শ থাকলে জানাবেন। আপনার ব্যবসার প্রয়োজন অনুযায়ী বিষয়গুলো ব্যাখ্যা করতে পারব।","ডেমো পাঠানো হয়েছে কি না নিশ্চিত করুন।"],
["কাস্টমার আগ্রহী নন","আপনার সময় ও মতামতের জন্য ধন্যবাদ। এই মুহূর্তে প্রয়োজন না থাকলে কোনো সমস্যা নেই। ভবিষ্যতে দরকার হলে আমাদের সঙ্গে যোগাযোগ করতে পারেন। ভালো থাকবেন।","সম্মান রেখে শেষ করুন।"],
["কল শেষে নোট রাখুন","কলের পর লিখে রাখুন: কাস্টমারের প্রয়োজন, বর্তমান অর্ডার পদ্ধতি, প্রধান সমস্যা, আগ্রহের মাত্রা, পাঠানো তথ্য এবং পরবর্তী যোগাযোগের সম্মত সময়।","এতে পরবর্তী ফলোআপ প্রাসঙ্গিক হবে।"]
]}
,{title:"১০. অতিরিক্ত প্রশ্নের উত্তর",intro:"কাস্টমার নির্দিষ্ট প্রশ্ন করলে সংক্ষেপে উত্তর দিন। যে সুবিধা বা শর্ত নিশ্চিত নন, সেটি যাচাই করে জানাবেন।",items:[
["ওয়েবসাইট আসলে কী কাজে আসবে?","ওয়েবসাইট হবে আপনার ব্যবসার নিজস্ব অনলাইন ঠিকানা। এখানে কাস্টমার পণ্য, মূল্য ও বিস্তারিত তথ্য দেখতে পারবেন এবং সরাসরি অর্ডার দিতে পারবেন। এতে ফেসবুক পেজের পাশাপাশি পণ্য ও অর্ডার পরিচালনার আরেকটি গোছানো মাধ্যম থাকবে।","কাস্টমারের ব্যবসার সঙ্গে মিলিয়ে উদাহরণ দিন।"],

["হোস্টিং সম্পর্কে জানতে চাইলে","আমাদের ব্যবস্থায় মাল্টি-সার্ভার হোস্টিং সুবিধা রয়েছে। হোস্টিংয়ের নির্দিষ্ট সীমা, মেয়াদ ও শর্ত প্যাকেজ অনুযায়ী আপনাকে পরিষ্কারভাবে জানিয়ে দেওয়া হবে।"],
["ওয়েবসাইট কি দ্রুত চলবে?","ওয়েবসাইট দ্রুত লোড হওয়ার জন্য অপটিমাইজড ব্যবস্থা রাখা হয়েছে। তবে লোডিং স্পিড ডিভাইস, নেটওয়ার্ক, কনটেন্ট ও ট্রাফিকের ওপরও নির্ভর করে। চাইলে ডেমো দেখে নিতে পারেন।"],
["সাপোর্ট পাব কি?","সাপোর্টের ধরন ও সময়সীমা প্যাকেজের শর্ত অনুযায়ী থাকবে। কাজ শুরুর আগে কী কী সাপোর্ট অন্তর্ভুক্ত, সেটি লিখিতভাবে জানিয়ে দেওয়া হবে।"],
["নিরাপত্তা ও ব্যাকআপ","নিরাপত্তা ও ব্যাকআপের নির্দিষ্ট ব্যবস্থা প্যাকেজ অনুযায়ী নিশ্চিত করে জানানো হবে। শুরু করার আগে বিষয়গুলো লিখিতভাবে পরিষ্কার করে নিতে পারবেন।"],
["মালিকানা ও অ্যাক্সেস","ডোমেইন, ওয়েবসাইট, ডেটা ও অ্যাডমিন অ্যাক্সেসের মালিকানা এবং হস্তান্তরের শর্ত কাজ শুরুর আগেই লিখিতভাবে জানিয়ে দেওয়া হবে।"]
]},
{title:"৪. ডেমো / ট্রায়াল ও ব্যবসার তথ্য",intro:"আগ্রহী হলে ডেমো দেখান। ডেমো তৈরির সময়, শর্ত ও কী কী তথ্য লাগবে তা আগে পরিষ্কার করুন।",items:[
["ডেমো অফার","আপনি চাইলে আপনার ব্যবসার ধরন অনুযায়ী একটি ট্রায়াল/ডেমো ওয়েবসাইট দেখাতে পারি। এতে পণ্য কীভাবে সাজানো হয়, কাস্টমার কীভাবে অর্ডার করেন এবং আপনি কীভাবে পরিচালনা করবেন—এসব সরাসরি বুঝতে পারবেন। দেখে তারপর সিদ্ধান্ত নিতে পারবেন।"],
["ডেমো দেখতে রাজি হলে","ধন্যবাদ। আপনার ব্যবসার নাম, পেজের লিংক এবং পণ্যের ধরনটি জানালে আপনার ব্যবসার সঙ্গে মিল রেখে উপযুক্ত ডেমো দেখানোর ব্যবস্থা করতে পারব।"],
["ডেমো লিংক পাঠানোর সময়","আপনার জন্য ডেমো লিংকটি পাঠিয়ে দিলাম: [ডেমো লিংক]। সময় করে দেখে নেবেন। পণ্য দেখা, অর্ডার প্রক্রিয়া ও ড্যাশবোর্ড সম্পর্কে কোনো প্রশ্ন থাকলে জানাবেন।"],
["ডেমো দেখার পর মতামত","ডেমোটি দেখার সুযোগ হয়েছে কি? আপনার ব্যবসার প্রয়োজন অনুযায়ী কোন বিষয়টি ভালো লেগেছে বা কোথাও পরিবর্তন দরকার মনে হয়েছে—জানালে সে অনুযায়ী আলোচনা করতে পারব।"],
["তথ্য সংগ্রহ","ডেমো/প্রাথমিক আলোচনা এগিয়ে নিতে আপনার ব্যবসার নাম, ফেসবুক পেজের লিংক, পণ্যের ধরন এবং যোগাযোগের নম্বরটি জানাতে পারেন।"]
]},
{title:"৫. মূল্য ও প্যাকেজ",intro:"মূল্য সব সময় পরিষ্কারভাবে বলুন। প্রথম বছরের মোট খরচ এবং পরবর্তী বছরের চার্জ আলাদা করে উল্লেখ করুন।",items:[
["মূল্য জানতে চাইলে","প্রথমবার সেটআপ চার্জ ১,০০০ টাকা—এককালীন। এরপর বছরে ২,৫০০ টাকা প্ল্যাটফর্ম চার্জ। অর্থাৎ প্রথম বছরে মোট ৩,৫০০ টাকা। অতিরিক্ত কাস্টম কাজ বা ফিচার প্রয়োজন হলে তার খরচ আগে জানানো হবে।"],
["শুধু মোট দাম জানতে চাইলে","প্রথম বছরে মোট ৩,৫০০ টাকা। এর মধ্যে ১,০০০ টাকা এককালীন সেটআপ চার্জ এবং ২,৫০০ টাকা বার্ষিক প্ল্যাটফর্ম চার্জ অন্তর্ভুক্ত।"],
["পরের বছর কত লাগবে?","পরবর্তী বছর থেকে বার্ষিক প্ল্যাটফর্ম চার্জ ২,৫০০ টাকা। কোনো অতিরিক্ত কাস্টম কাজ বা আলাদা সেবা প্রয়োজন হলে সেটি আগে আলোচনা করে জানানো হবে।"],
["অতিরিক্ত চার্জ আছে কি?","প্যাকেজের অন্তর্ভুক্ত সুবিধার বাইরে অতিরিক্ত কাস্টমাইজেশন বা কাজের প্রয়োজন হলে তার খরচ কাজ শুরুর আগে জানানো হবে। আপনার অনুমতি ছাড়া অতিরিক্ত কাজ শুরু করা হবে না।"],
["দাম বেশি মনে হলে","আপনার বাজেটের বিষয়টি বুঝতে পারছি। সিদ্ধান্তের আগে ডেমো দেখে প্যাকেজে কী কী সুবিধা রয়েছে তা যাচাই করতে পারেন। আপনার ব্যবসায় সুবিধাগুলো বাস্তব কাজে লাগবে মনে হলেই এগোনো উচিত।"]
]},
{title:"৬. ব্যবসা ছোট / বাজেট নেই / এখন দরকার নেই",intro:"কাস্টমারের ব্যবসার আকার বা বাজেট নিয়ে কোনো নেতিবাচক মন্তব্য করবেন না। প্রয়োজন না থাকলে সিদ্ধান্তের স্বাধীনতা দিন।",items:[
["ব্যবসা ছোট বললে","বুঝতে পারছি। ব্যবসা ছোট বা বড়—দুই ক্ষেত্রেই পণ্য গোছানোভাবে উপস্থাপন ও অর্ডার নেওয়ার সুবিধা কাজে লাগতে পারে। তবে আপনার বর্তমান বিক্রি ও প্রয়োজনের সঙ্গে খরচটি মানানসই কি না, সেটি বিবেচনা করেই সিদ্ধান্ত নেওয়া ভালো।"],
["এখন বাজেট নেই","বুঝতে পারছি। এই মুহূর্তে বাজেট উপযুক্ত না হলে এখনই সিদ্ধান্ত নেওয়ার প্রয়োজন নেই। চাইলে তথ্যগুলো রেখে দিতে পারেন; ভবিষ্যতে সুবিধাজনক সময়ে বিবেচনা করবেন।"],
["এখন ওয়েবসাইটের দরকার নেই","অবশ্যই, আপনার বর্তমান ব্যবস্থায় যদি প্রয়োজন না থাকে তাহলে এখনই নেওয়ার দরকার নেই। ভবিষ্যতে পণ্য উপস্থাপন বা অর্ডার পরিচালনা আরও গোছানোর প্রয়োজন হলে যোগাযোগ করতে পারেন।"],
["শুধু ফেসবুকেই ব্যবসা ভালো চলছে","এটা ভালো বিষয়। ওয়েবসাইট ফেসবুকের বিকল্প নয়; এটি অতিরিক্ত একটি নিজস্ব প্ল্যাটফর্ম, যেখানে পণ্য ও অর্ডার আরও গোছানোভাবে রাখা যায়। আপনার ব্যবসায় আলাদা সুবিধা হবে মনে হলেই বিবেচনা করবেন।"],
["আগে ব্যবসা বড় হোক, পরে নেব","অবশ্যই, ব্যবসার পরিকল্পনা অনুযায়ী সিদ্ধান্ত নেওয়াই ভালো। ভবিষ্যতে যখন পণ্য ও অর্ডার পরিচালনার জন্য আলাদা প্ল্যাটফর্ম দরকার মনে হবে, তখন ডেমো ও প্যাকেজের তথ্য দেখে নিতে পারবেন।"]
]},
{title:"৭. আগে থেকেই ওয়েবসাইট থাকলে",intro:"অন্য ওয়েবসাইটকে খারাপ বলবেন না। বর্তমান সিস্টেমে কোনো অপূর্ণতা আছে কি না জেনে তুলনার সুযোগ দিন।",items:[
["আগে থেকেই ওয়েবসাইট আছে","চমৎকার। আপনার বর্তমান ওয়েবসাইটে কি পণ্য উপস্থাপন, অর্ডার ম্যানেজমেন্ট, অ্যাপ সুবিধা ও হোস্টিং নিয়ে আপনি সন্তুষ্ট? চাইলে আমাদের ডেমোটি বিকল্প হিসেবে দেখে তুলনা করতে পারেন।"],
["বর্তমান ওয়েবসাইট ভালো চলছে","খুব ভালো। আপনার বর্তমান ব্যবস্থাটি ভালোভাবে কাজ করলে পরিবর্তনের কোনো প্রয়োজন নেই। ভবিষ্যতে নতুন ফিচার বা বিকল্প প্ল্যাটফর্ম বিবেচনা করলে আমাদের ডেমো দেখতে পারেন।"],
["অন্য প্রতিষ্ঠানের ওয়েবসাইট","অবশ্যই, আপনি তুলনা করে দেখুন। শুধু দাম নয়—বার্ষিক চার্জ, হোস্টিং, ফিচার, সাপোর্ট, ডেটা ও মালিকানার শর্ত মিলিয়ে সিদ্ধান্ত নেবেন।"],
["ওয়েবসাইট আছে, কিন্তু অর্ডার আসে না","বুঝতে পারছি। ওয়েবসাইট থাকলেই অর্ডার নিশ্চিত হয় না; পণ্যের চাহিদা, প্রচার, মূল্য, কনটেন্ট ও কাস্টমার অভিজ্ঞতাও গুরুত্বপূর্ণ। চাইলে আপনার বর্তমান সাইটটি দেখে সম্ভাব্য উন্নতির বিষয়গুলো আলোচনা করতে পারি।"]
]},
{title:"৮. আগ্রহী কিন্তু পরে জানাবেন",intro:"আগ্রহ থাকলে সম্মতি নিয়ে তথ্য পাঠান এবং নির্দিষ্ট সময়ে যোগাযোগের সুযোগ রাখুন। বারবার মেসেজ দেবেন না।",items:[
["আগ্রহ আছে, পরে জানাবেন","অবশ্যই, আপনি সময় নিয়ে সিদ্ধান্ত নিন। আমি কি সার্ভিসের সংক্ষিপ্ত তথ্য ও ডেমো লিংক পাঠিয়ে রাখব? দেখে আপনার সুবিধামতো জানাতে পারবেন।"],
["পরিবার/পার্টনারের সঙ্গে আলোচনা করবেন","অবশ্যই। যাঁরা সিদ্ধান্তের সঙ্গে যুক্ত, তাঁদের সঙ্গে আলোচনা করে নিন। চাইলে তাঁদের দেখানোর জন্য সার্ভিস, মূল্য ও ডেমোর তথ্য একসঙ্গে পাঠিয়ে দিচ্ছি।"],
["একটু সময় চান","নিশ্চয়ই। আপনি সময় নিয়ে দেখুন। আপনার সুবিধামতো কবে আবার যোগাযোগ করলে ভালো হবে জানালে সে অনুযায়ী যোগাযোগ করব।"],
["পরে যোগাযোগ করতে বলেছেন","ধন্যবাদ। আপনার নির্দেশনা অনুযায়ী [তারিখ/সময়]-এ আবার যোগাযোগ করব। এর মধ্যে কোনো প্রশ্ন থাকলে জানাতে পারেন।"],
["মেসেজ দেখে জানাবেন","অবশ্যই। তথ্যগুলো পাঠিয়ে দিচ্ছি। সময় করে দেখে নেবেন; কোনো বিষয় পরিষ্কার করার প্রয়োজন হলে জানাবেন।"]
]},

let mode='call',active=0;const nav=document.getElementById('nav'),cards=document.getElementById('cards'),title=document.getElementById('title'),intro=document.getElementById('intro'),subtitle=document.getElementById('subtitle'),search=document.getElementById('search');
function data(){return mode==='call'?callSections:msgSections}
function setMode(m){mode=m;active=0;search.value='';document.getElementById('callTab').classList.toggle('active',m==='call');document.getElementById('msgTab').classList.toggle('active',m==='msg');search.placeholder=m==='call'?'কলের ধাপ বা পরিস্থিতি খুঁজুন...':'মেসেজ খুঁজুন...';render()}
function render(){let d=data();nav.innerHTML=d.map((s,i)=>`<button class="navbtn ${i===active?'active':''}" onclick="select(${i})">${s.title}</button>`).join('');let s=d[active];title.textContent=s.title;subtitle.textContent=mode==='call'?'ধাপে ধাপে কল পরিচালনার গাইড':'প্রস্তুত মেসেজ — কপি করে পাঠান';intro.textContent=s.intro||'পরিস্থিতি অনুযায়ী মেসেজ নির্বাচন করে কপি করুন।';let q=search.value.trim().toLowerCase();let list=s.items.filter(x=>(x[0]+' '+x[1]+' '+(x[2]||'')).toLowerCase().includes(q));cards.innerHTML=list.length?list.map(x=>`<article class="card"><div class="cardtop"><h3>${esc(x[0])}</h3><span class="tag">${mode==='call'?'CALL SCRIPT':'READY TO SEND'}</span></div><div class="say">${esc(x[1])}</div>${x[2]?`<div class="tip">পরামর্শ: ${esc(x[2])}</div>`:''}<div class="actions"><button class="btn copy" onclick='copyText(${JSON.stringify(x[1])})'>${mode==='call'?'স্ক্রিপ্ট কপি':'মেসেজ কপি'}</button></div></article>`).join(''):'<div class="empty">কোনো ফল পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।'}
function select(i){active=i;search.value='';render()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('কপি হয়েছে')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('কপি হয়েছে')}}
function copyAll(){let s=data()[active],q=search.value.trim().toLowerCase(),list=s.items.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));copyText(list.map(x=>x[0]+'\n'+x[1]).join('\n\n──────────\n\n'))}
function resetSearch(){search.value='';render()}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
search.addEventListener('input',render);render();
</script></body></html>
